<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Local synthetic prototype for the Funds Manager Sprint 2 dashboard.">
  <title>Funds Manager | Prototype Sprint 2</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2335204f'/%3E%3Cpath d='M16 43V31h8v12zm12 0V17h8v26zm12 0V25h8v18z' fill='%23f7f2fa'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/layout.css">
  <link rel="stylesheet" href="styles/components.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>

  <div class="app-shell" data-sidebar="open">
    <aside class="sidebar glass-panel" aria-label="Primary navigation">
      <div class="brand-lockup">
        <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
        <span class="brand-copy"><strong>Funds Manager</strong><small>YvY Capital</small></span>
      </div>

      <nav class="primary-nav" aria-label="Prototype sections">
        <p class="nav-label">Executive</p>
        <button class="nav-item is-active" type="button" data-view="overview" aria-current="page">
          <span class="nav-icon" aria-hidden="true">01</span><span>Overview</span>
        </button>
        <button class="nav-item" type="button" data-view="funds">
          <span class="nav-icon" aria-hidden="true">02</span><span>Funds</span>
        </button>
        <button class="nav-item" type="button" data-view="fund-detail">
          <span class="nav-icon" aria-hidden="true">03</span><span>Allocation</span>
        </button>
        <button class="nav-item" type="button" data-view="performance">
          <span class="nav-icon" aria-hidden="true">04</span><span>Performance</span>
        </button>
        <button class="nav-item" type="button" data-view="comparison">
          <span class="nav-icon" aria-hidden="true">05</span><span>Comparison</span>
        </button>
        <button class="nav-item" type="button" data-view="peers">
          <span class="nav-icon" aria-hidden="true">06</span><span>Peers</span>
        </button>

        <p class="nav-label">Operations</p>
        <button class="nav-item" type="button" data-view="quality">
          <span class="nav-icon" aria-hidden="true">07</span><span>Data quality</span>
        </button>
        <button class="nav-item" type="button" data-view="import">
          <span class="nav-icon" aria-hidden="true">08</span><span>Import & validation</span>
        </button>
        <button class="nav-item" type="button" data-view="runs">
          <span class="nav-icon" aria-hidden="true">09</span><span>Runs & lineage</span>
        </button>
      </nav>

      <div class="sidebar-note">
        <span class="status-dot" aria-hidden="true"></span>
        <div><strong>Prototype mode</strong><small>Synthetic data</small></div>
      </div>
    </aside>

    <div class="main-shell">
      <header class="topbar glass-panel">
        <button class="icon-button menu-button" id="menu-button" type="button" aria-label="Open or close navigation" aria-expanded="true">
          <span aria-hidden="true">Menu</span>
        </button>

        <div class="breadcrumb" aria-label="Current location">
          <span>Funds Manager</span><span aria-hidden="true">/</span><strong id="current-page-label">Overview</strong>
        </div>

        <div class="topbar-actions">
          <label class="compact-field">
            <span>Journey</span>
            <select id="role-select" aria-label="Select a user journey">
              <option value="direction">Executive</option>
              <option value="analyst">Analyst</option>
            </select>
          </label>
          <button class="icon-button" id="help-button" type="button" aria-label="Show prototype help">?</button>
          <button class="avatar-button" type="button" aria-label="Demonstration profile">YD</button>
        </div>
      </header>

      <section class="context-bar" aria-label="Global filters">
        <label class="filter-field">
          <span>Fund</span>
          <select id="fund-select"></select>
        </label>
        <label class="filter-field">
          <span>Period</span>
          <select id="period-select">
            <option value="1m">1 month</option>
            <option value="3m">3 months</option>
            <option value="6m">6 months</option>
            <option value="12m" selected>12 months</option>
          </select>
        </label>
        <label class="filter-field prototype-control">
          <span>Prototype scenario</span>
          <select id="scenario-select">
            <option value="sample">Sample data</option>
            <option value="current">Current data</option>
            <option value="loading">Loading</option>
            <option value="late">Late data</option>
            <option value="incomplete">Incomplete data</option>
            <option value="empty">Empty state</option>
            <option value="error">Error</option>
            <option value="denied">Access denied</option>
            <option value="no-match">No results</option>
            <option value="hypothesis">Hypothesis pending validation</option>
          </select>
        </label>
        <div class="source-status" id="source-status">
          <span class="status-dot" aria-hidden="true"></span>
          <span><strong>SPRINT2-WF-001</strong><small>Synthetic source · current</small></span>
        </div>
      </section>

      <main id="main-content" tabindex="-1">
        <div id="scenario-banner"></div>
        <div id="app-view" aria-live="polite" aria-busy="true"></div>
      </main>
    </div>
  </div>

  <dialog class="modal" id="anomaly-dialog" aria-labelledby="anomaly-title">
    <div class="modal-header">
      <div><span class="eyebrow">Control details</span><h2 id="anomaly-title">Anomaly</h2></div>
      <button class="icon-button" type="button" data-action="close-dialog" aria-label="Close details">Close</button>
    </div>
    <div id="anomaly-content"></div>
    <div class="modal-actions">
      <button class="button secondary" type="button" data-action="quarantine-anomaly">Quarantine</button>
      <button class="button primary" type="button" data-action="resolve-anomaly">Mark as resolved</button>
    </div>
  </dialog>

  <div class="toast-region" id="toast-region" role="status" aria-live="polite" aria-atomic="true"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
